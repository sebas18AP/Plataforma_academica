<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Monitoreo Académico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md mx-4">
        <!-- Logo y Títulos -->
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-16 bg-blue-600 rounded-xl flex items-center justify-center text-white text-3xl shadow-lg">
                ⚡
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800 leading-tight">Plataforma de<br>Monitoreo Académico</h1>
                <p class="text-xs text-gray-500 mt-1">Facultad de Ingeniería Eléctrica<br>UNITEC</p>
            </div>
        </div>
        <!-- Formulario -->
        <form onsubmit="event.preventDefault(); alert('el boton funciona correctamente');" class="space-y-4">
            <div>
                <input type="text" placeholder="Usuario" class="w-full px-5 py-4 bg-gray-100 text-gray-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div>
                <input type="password" placeholder="Contraseña" class="w-full px-5 py-4 bg-gray-100 text-gray-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-4 rounded-2xl shadow-md transition-colors">
                Iniciar Sesión
            </button>
        </form>
        <div class="mt-6 text-center">
            <button type="button" onclick="alert('el boton funciona correctamente');" class="text-sm text-blue-500 hover:text-blue-700 transition-colors">
                ¿Olvidaste tu contraseña?
            </button>
        </div>
    </div>
</body>
</html>
