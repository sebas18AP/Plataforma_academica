<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Calificaciones - Plataforma Académica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar Simple -->
    <nav class="bg-white shadow-md py-4 px-8 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-600">⚡ Sistema Académico</div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-600">Bienvenido, <b>{{ usuario }}</b></span>
            <a href="/dashboard" class="text-blue-600 hover:underline text-sm font-semibold">Volver al Dashboard</a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto mt-12 px-4">
        <div class="bg-white rounded-xl shadow-lg p-8 border-l-8 border-green-500">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Ingreso de Calificaciones</h1>
                <p class="text-gray-500">Asigna calificaciones a los estudiantes en las materias impartidas.</p>
            </div>

            <form action="/calificar" method="POST" class="space-y-6">
                <!-- Select Estudiantes -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Seleccionar Estudiante</label>
                    <select name="estudiante_id" required
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white transition">
                        <option value="" disabled selected>-- Elige un estudiante --</option>
                        {% for est in estudiantes %}
                        <option value="{{ est.identificacion }}">{{ est.nombre }} (ID: {{ est.identificacion }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Select Asignaturas -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Seleccionar Asignatura</label>
                    <select name="codigo_asignatura" required
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white transition">
                        <option value="" disabled selected>-- Elige una materia --</option>
                        {% for asig in asignaturas %}
                        <option value="{{ asig.codigo }}">{{ asig.nombre }} ({{ asig.codigo }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Campo Nota -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nota (0.0 a 5.0)</label>
                    <input type="number" name="nota" required step="0.1" min="0.0" max="5.0"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition"
                        placeholder="Ej: 4.5">
                </div>

                <!-- Select Corte -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Corte</label>
                    <select name="corte" required
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white transition">
                        <option value="" disabled selected>-- Elige un corte --</option>
                        <option value="Corte 1">Corte 1</option>
                        <option value="Corte 2">Corte 2</option>
                        <option value="Corte 3">Corte 3</option>
                        <option value="Final">Final</option>
                    </select>
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 shadow-md transform hover:scale-[1.01] transition">
                        Registrar Calificación
                    </button>
                </div>
            </form>
        </div>

        <div class="mt-8 bg-green-50 p-4 rounded-lg border border-green-100 flex items-start gap-3">
            <span class="text-green-500 mt-1">ℹ️</span>
            <p class="text-sm text-green-700">
                <b>Atención:</b> Las notas ingresadas no podrán ser modificadas a través de este formulario después de ser registradas.
            </p>
        </div>
    </div>

</body>
</html>
