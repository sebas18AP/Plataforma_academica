<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Monitoreo Académico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md mx-4">
        <!-- Logo y Títulos -->
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-16 bg-blue-600 rounded-xl flex items-center justify-center text-white text-3xl shadow-lg">
                ⚡
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800 leading-tight">Plataforma de<br>Monitoreo Académico</h1>
                <p class="text-xs text-gray-500 mt-1">Facultad de Ingeniería Eléctrica<br>UNITEC</p>
            </div>
        </div>
        
        <!-- Mensaje de estado -->
        <div id="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg hidden"></div>
        <div id="successMessage" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg hidden"></div>
        
        <!-- Formulario -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Correo Institucional</label>
                <input type="email" id="usuario" name="usuario" placeholder="Ej: c.perez@unitec.edu.co" 
                       class="w-full px-5 py-4 bg-gray-100 text-gray-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" 
                       required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" 
                       class="w-full px-5 py-4 bg-gray-100 text-gray-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" 
                       required>
            </div>
            <button type="submit" id="loginBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-medium py-4 rounded-2xl shadow-md transition-colors">
                Iniciar Sesión
            </button>
        </form>
        
        <!-- Credenciales de prueba -->
        <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <p class="text-xs font-semibold text-blue-900 mb-2">Credenciales de prueba:</p>
            <p class="text-xs text-blue-800"><strong>Correo:</strong> c.perez@unitec.edu.co</p>
            <p class="text-xs text-blue-800"><strong>Contraseña:</strong> unitec2026</p>
        </div>
        
        <div class="mt-6 text-center">
            <button type="button" class="text-sm text-blue-500 hover:text-blue-700 transition-colors">
                ¿Olvidaste tu contraseña?
            </button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('successMessage').textContent = '¡Login exitoso! Redirigiendo...';
                    document.getElementById('successMessage').classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    document.getElementById('errorMessage').textContent = data.mensaje || 'Error en el login';
                    document.getElementById('errorMessage').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Error en la conexión';
                document.getElementById('errorMessage').classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
